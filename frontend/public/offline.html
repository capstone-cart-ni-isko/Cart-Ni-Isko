<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <title>Tindahan ni Isko — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FFFFFF;
        color: #1F2937;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        background: #F97316;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 40px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #6B7280;
        margin-bottom: 24px;
      }
      button {
        background: #F97316;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 9999px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">TI</div>
      <h1>You're offline</h1>
      <p>Tindahan ni Isko needs an internet connection to load new content. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
