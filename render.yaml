# ── Deployment topology for the 1-second frontend <-> backend <-> database budget
#
# The database lives in Supabase ap-northeast-1 (Tokyo). The backend must run
# in the same cloud region, otherwise every request pays a ~700 ms geographic
# round trip BEFORE the query itself and login can never fit in 1 second.
#
# Render's `singapore` region is the closest available to ap-northeast-1
# (~2 500 km / ~70 ms RTT, versus ~7 000 km / ~350 ms from `oregon`).
# `frontend/vercel.json` must point VITE_API_BASE_URL at the same service.
services:
  - type: web
    name: cart-ni-isko-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # Directive: colocate with Supabase ap-northeast-1 (Tokyo).
    region: singapore
    # Keep the instance warm: a cold start re-handshakes TLS to the pooler.
    minRunInstances: 1
    healthCheckPath: /api/products/filter
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PHP_CLI_SERVER_WORKERS
        value: 8
      - key: DB_CONNECTION
        value: pgsql
      # Supabase IPv4 connection pooler (transaction mode). The direct
      # `db.<ref>.supabase.co` host is IPv6-only and does not resolve here.
      - key: DB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_PERSISTENT
        value: "true"
      # System rule 71 (the two portals are separate) AND ISO 25010
      # Interoperability: the browser only sends cross-origin requests to an
      # API that names the origin it came from. Without this the middleware
      # falls back to the localhost dev pair and EVERY call from the deployed
      # PWA and web build is refused by CORS, however healthy the API is.
      # The Vercel preview domain belongs on the same list when it is known.
      - key: CORS_ALLOWED_ORIGINS
        value: https://cartniisko.com,https://www.cartniisko.com
      # REQ-CHECKOUT-03: absolute origin of the SPA - where PayMongo sends
      # the browser back after the hosted checkout. Frontend, not API.
      - key: FRONTEND_URL
        value: https://cartniisko.com
      - key: APP_URL
        value: https://cart-ni-isko-api.onrender.com
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_KEY
        sync: false
